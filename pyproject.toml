[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-code-copilot"
version = "0.2.0"
description = "Super MCP Code Copilot — AI-powered coding agent server with token-optimized file editing, batch reads, diagnostics, and undo support."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vignesh Manivasakam" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "starlette>=0.35.0",
    "sse-starlette>=2.0.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.25.0",
    "python-dotenv>=1.0.0",
    "chardet>=5.2.0",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
mcp-code-copilot = "server:main"
copilot = "server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["copilot*"]
exclude = [
    "tools*",
    "middleware*",
    "services*",
    "assets*",
    "prompts*",
    "tests*",
    "utils*",
]

[tool.setuptools]
py-modules = ["config", "server"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

